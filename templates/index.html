<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Uber - Tempo Real</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; }
        #sidebar { width: 380px; background: #121212; color: white; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
        #map { flex-grow: 1; height: 100%; }
        h2 { margin-top: 0; color: #00d26a; }
        h3 { color: #00d26a; margin-top: 15px; margin-bottom: 10px; font-size: 1.1em; }
        .info-box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        button { background: #00d26a; color: black; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background: #00b058; }
        .btn-secondary { background: #333; color: white; }
        .btn-secondary:hover { background: #444; }
        .btn-driver { background: #28a745; color: white; }
        .btn-driver:hover { background: #218838; }
        .ride-card { background: #2a2a2a; border-left: 4px solid #00d26a; padding: 12px; margin-top: 10px; border-radius: 4px; }
        .ride-card p { margin: 4px 0; font-size: 0.9em; }
        .ride-card button { margin-top: 8px; padding: 8px; font-size: 0.9em; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <h2>🚗 Mini Uber - Live</h2>
            
            <!-- Modo Passageiro -->
            <div class="info-box">
                <p><strong>Instruções:</strong></p>
                <p id="instruction">Clique no mapa para definir o ponto de <strong>Partida</strong>.</p>
            </div>

            <div class="info-box" id="details" style="display:none;">
                <p><strong>Distância:</strong> <span id="dist">-</span></p>
                <p><strong>Tempo Estimado:</strong> <span id="time">-</span></p>
                <p><strong>Valor Estimado:</strong> <span id="price" style="color: #00d26a; font-size: 1.2em;">-</span></p>
                <button id="callBtn" onclick="requestRide()">Chamar Motorista</button>
            </div>

            <div class="info-box" id="statusBox
