<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Uber - Tempo Real</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; }
        #sidebar { width: 380px; background: #121212; color: white; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
        #map { flex-grow: 1; height: 100%; }
        h2 { margin-top: 0; color: #00d26a; }
        h3 { color: #00d26a; margin-top: 15px; margin-bottom: 10px; font-size: 1.1em; }
        .info-box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        button { background: #00d26a; color: black; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background: #00b058; }
        .btn-secondary { background: #333; color: white; }
        .btn-secondary:hover { background: #444; }
        .btn-driver { background: #28a745; color: white; }
        .btn-driver:hover { background: #218838; }
        .ride-card { background: #2a2a2a; border-left: 4px solid #00d26a; padding: 10px; margin-top: 10px; border-radius: 4px; }
        .ride-card p { margin: 4px 0; font-size: 0.9em; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <h2>🚗 Mini Uber - Live</h2>
            
            <!-- Modo Passageiro -->
            <div class="info-box">
                <p><strong>Instruções:</strong></p>
                <p id="instruction">Clique no mapa para definir o ponto de <strong>Partida</strong>.</p>
            </div>

            <div class="info-box" id="details" style="display:none;">
                <p><strong>Distância:</strong> <span id="dist">-</span></p>
                <p><strong>Tempo Estimado:</strong> <span id="time">-</span></p>
                <p><strong>Valor Estimado:</strong> <span id="price" style="color: #00d26a; font-size: 1.2em;">-</span></p>
                <button id="callBtn" onclick="requestRide()">Chamar Motorista</button>
            </div>

            <div class="info-box" id="statusBox" style="display:none; background: #0f3d24;">
                <p id="statusText" style="margin: 0; font-weight: bold; color: #00d26a;">Status: Aguardando...</p>
            </div>

            <!-- Painel de Controlo do Motorista -->
            <div class="info-box" style="border-top: 1px solid #333; margin-top: 20px;">
                <h3>🚘 Painel do Motorista</h3>
                <button class="btn-driver" onclick="loadPendingRides()">Buscar Corridas Pendentes</button>
                <div id="pending-rides-list"></div>
            </div>
        </div>

        <button id="resetBtn" class="btn-secondary" onclick="resetMap()" style="display:none; margin-top: 15px;">Reiniciar Corrida</button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([-18.2253, -44.4178], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let pickupMarker = null;
        let dropoffMarker = null;
        let carMarker = null;
        let routeLayer = null;
        let state = 'PICKUP'; 
        let rideData = {};
        let activeWs = null;

        map.on('click', function(e) {
            if (state !== 'PICKUP' && state !== 'DROPOFF') return;
            const { lat, lng } = e.latlng;

            if (state === 'PICKUP') {
                if (pickupMarker) map.removeLayer(pickupMarker);
                pickupMarker = L.marker([lat, lng]).addTo(map).bindPopup('Partida').openPopup();
                state = 'DROPOFF';
                document.getElementById('instruction').innerHTML = 'Clique no mapa para definir o <strong>Destino</strong>.';
            } else if (state === 'DROPOFF') {
                if (dropoffMarker) map.removeLayer(dropoffMarker);
                dropoffMarker = L.marker([lat, lng]).addTo(map).bindPopup('Destino').openPopup();
                state = 'READY';
                document.getElementById('instruction').innerHTML = 'Rota pronta. Confirme a corrida abaixo!';
                document.getElementById('resetBtn').style.display = 'block';

                calculateRoute(
                    pickupMarker.getLatLng().lat, pickupMarker.getLatLng().lng,
                    dropoffMarker.getLatLng().lat, dropoffMarker.getLatLng().lng
                );
            }
        });

        async function calculateRoute(pLat, pLon, dLat, dLon) {
            rideData = { user_id: 1, pickup_lat: pLat, pickup_lon: pLon, dropoff_lat: dLat, dropoff_lon: dLon };
            
            try {
                const response = await fetch('/api/rides/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(rideData)
                });
                const data = await response.json();

                if (data.error) {
                    alert(data.error);
                    return;
                }

                const fare = data.ride ? data.ride.estimated_fare : 10.0;
                document.getElementById('dist').innerText = 'Calculada';
                document.getElementById('time').innerText = 'Estimado';
                document.getElementById('price').innerText = 'R$ ' + fare.toFixed(2);
                document.getElementById('details').style.display = 'block';

                // Desenha a linha direta até receber a rota do OSRM se necessário
                if (routeLayer) map.removeLayer(routeLayer);
                routeLayer = L.polyline([[pLat, pLon], [dLat, dLon]], { color: '#00d26a', weight: 5 }).addTo(map);
                map.fitBounds(routeLayer.getBounds());
            } catch (err) {
                console.error("Erro ao calcular corrida:", err);
            }
        }

        function requestRide() {
            document.getElementById('details').style.display = 'none';
            document.getElementById('statusBox').style.display = 'block';
            document.getElementById('statusText').innerText = 'Status: Procurando motorista...';

            const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            activeWs = new WebSocket(wsProtocol + window.location.host + '/ws/ride-simulation');

            activeWs.onopen = function() {
                activeWs.send(JSON.stringify(rideData));
            };

            activeWs.onmessage = function(event) {
                const data = JSON.parse(event.data);

                if (data.status === 'driving') {
                    document.getElementById('statusText').innerText = 'Status: 🚗 Motorista a caminho do destino...';
                    
                    if (!carMarker) {
                        carMarker = L.marker([data.lat, data.lon], {
                            icon: L.divIcon({ className: 'car-icon', html: '🚗', iconSize: [30, 30] })
                        }).addTo(map);
                    } else {
                        carMarker.setLatLng([data.lat, data.lon]);
                    }
                } else if (data.status === 'arrived') {
                    document.getElementById('statusText').innerText = 'Status: ✅ Corrida finalizada!';
                }
            };

            activeWs.onclose = function() {
                console.log('Conexão encerrada.');
            };
        }

        // Função para motorista buscar e aceitar corridas
        async function loadPendingRides() {
            const listContainer = document.getElementById('pending-rides-list');
            listContainer.innerHTML = '<p style="font-size:0.8em; color:#aaa;">Buscando corridas...</p>';
            
            const driverIdPrompt = prompt("Insira o seu ID de Motorista:", "1");
            if (!driverIdPrompt) return;
            
            const rideIdPrompt = prompt("Insira o ID da Corrida que deseja aceitar:", "1");
            if (!rideIdPrompt) return;

            try {
                const response = await fetch('/api/rides/accept', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ride_id: parseInt(rideIdPrompt),
                        driver_id: parseInt(driverIdPrompt)
                    })
                });
                
                const resData = await response.json();
                
                if (resData.status === "success") {
                    listContainer.innerHTML = `
                        <div class="ride-card">
                            <p><strong>Corrida #${resData.ride.id} Aceita!</strong></p>
                            <p>Status: ${resData.ride.status}</p>
                            <p>Tarifa: R$ ${resData.ride.estimated_fare}</p>
                        </div>
                    `;
                    alert("Corrida aceita com sucesso!");
                } else {
                    alert("Erro: " + (resData.error || "Não foi possível aceitar a corrida."));
                    listContainer.innerHTML = '';
                }
            } catch (err) {
                console.error("Erro ao aceitar corrida:", err);
                alert("Falha na comunicação com o servidor.");
            }
        }

        function resetMap() {
            if (pickupMarker) map.removeLayer(pickupMarker);
            if (dropoffMarker) map.removeLayer(dropoffMarker);
            if (carMarker) map.removeLayer(carMarker);
            if (routeLayer) map.removeLayer(routeLayer);
            pickupMarker = null;
            dropoffMarker = null;
            carMarker = null;
            routeLayer = null;
            state = 'PICKUP';
            document.getElementById('instruction').innerHTML = 'Clique no mapa para definir o ponto de <strong>Partida</strong>.';
            document.getElementById('details').style.display = 'none';
            document.getElementById('statusBox').style.display = 'none';
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('pending-rides-list').innerHTML = '';
        }
    </script>
</body>
</html>
